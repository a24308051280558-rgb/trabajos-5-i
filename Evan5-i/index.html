<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Store - Inicio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nflRed: '#FF0000',
                        nflRedDark: '#CC0000',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="bg-nflRed text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="img/logo.png" alt="Logo NFL Shop" class="w-12 h-12 rounded-full object-cover border-2 border-white bg-white">
                <span class="font-black text-2xl tracking-wider">NFL SHOP</span>
            </div>
            <div class="flex space-x-2 md:space-x-4 text-sm font-semibold">
                <a href="index.html" class="px-3 py-2 bg-nflRedDark rounded transition">Inicio</a>
                <a href="equipos.html" class="px-3 py-2 rounded hover:bg-nflRedDark transition">Equipos</a>
                <a href="cuenta.html" class="px-3 py-2 rounded hover:bg-nflRedDark transition"><i class="fas fa-user mr-1"></i> Cuenta</a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow max-w-7xl mx-auto p-4 w-full space-y-6">
        <!-- BANNER PRINCIPAL (banner_nfl.jpg) -->
        <div class="relative h-64 md:h-80 rounded-xl shadow-md w-full overflow-hidden flex items-center justify-center">
            <img src="img/banner_nfl.jpg" alt="Banner Oficial NFL" class="absolute inset-0 w-full h-full object-cover">
            <div class="relative z-10 p-6 bg-white/90 backdrop-blur-sm rounded-lg max-w-md shadow-lg text-center">
                <h1 class="text-3xl font-extrabold text-nflRed mb-2">PRODUCTOS OFICIALES NFL</h1>
                <p class="text-gray-700 text-sm mb-4">Consigue los mejores jerseys, gorras y accesorios de tu equipo favorito.</p>
                <a href="equipos.html" class="inline-block bg-nflRed text-white px-6 py-2 rounded-lg font-bold hover:bg-nflRedDark shadow transition">Ver Equipos</a>
            </div>
        </div>

       
    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white text-center py-6 mt-8 border-t-4 border-nflRed">
        <p class="font-bold text-base tracking-wide">Hernández Heredia Evan Renato</p>
        <p class="text-sm text-gray-400 mt-1">Grupo: 5-i | No.Control: 0558</p>
        <p class="text-xs text-gray-500 mt-2">Proyecto Final Submódulo - Sitio Web e Integración SQL</p>
    </footer>

</body>
</html>
